<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모두를 위한 설교</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#eaf4ff;--ink:#14213d;--sub:#3d4b66;--accent:#7b4dff;--card:#ffffff;--cardink:#14213d;color-scheme:light;--focus:#8b4df0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) linear-gradient(180deg,#dff0ff 0%,#fff6dc 100%) fixed;color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;min-height:100vh}
main{max-width:1100px;margin:0 auto;padding:32px 24px 48px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
h1{font-size:clamp(34px,6vw,64px);font-weight:900;margin:0;line-height:1.15;letter-spacing:-.02em}
.sub{font-size:clamp(20px,3vw,28px);font-weight:700;margin:12px 0 0;color:var(--sub)}
.rule{height:3px;width:min(280px,60%);background:var(--accent);margin:20px 0 24px;border:0}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
#msg{min-height:1.6em;margin:18px 0 0;font-size:18px;color:var(--sub)}
.dove{width:100%;max-width:440px;justify-self:center;fill:var(--ink)}
@media (max-width:760px){main{grid-template-columns:1fr;padding-top:20px}.dove{order:-1;max-width:220px}h1,.sub{text-align:center}.rule{margin-left:auto;margin-right:auto}.types{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.dove{animation:glide 1s ease-out both}@keyframes glide{from{opacity:0;transform:translate(-24px,16px)}to{opacity:1;transform:none}}}
.back{font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:none;border:2px solid var(--ink);border-radius:999px;padding:10px 20px;cursor:pointer;margin-bottom:20px}
.back:hover{border-color:var(--accent);color:var(--accent)}
#list{display:block;max-width:760px}
#list[hidden],#home[hidden]{display:none}
#list h1{font-size:clamp(30px,5vw,48px)}
.vids{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.vids button,.vids a{width:100%;display:flex;gap:16px;align-items:center;text-align:left;font:inherit;color:var(--cardink);background:var(--card);border:2px solid transparent;border-radius:14px;padding:12px;cursor:pointer;min-height:96px}
.vids a{text-decoration:none}
.vids button:hover,.vids a:hover{border-color:var(--accent)}
.thumb{flex:none;width:120px;aspect-ratio:16/9;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.thumb:after{content:"";border-left:22px solid var(--bg);border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.vt{display:block;font-size:clamp(18px,2.4vw,22px);font-weight:700}
.vm{display:block;font-size:15px;color:var(--sub);margin-top:4px}
.rec{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 4px 0;font-size:16px;color:var(--sub)}
.rec input[type=date],.rec input[type=text]{font:inherit;font-size:16px;color:var(--cardink);background:var(--card);border:2px solid transparent;border-radius:10px;padding:8px 10px}
.rec input[type=text]{flex:1;min-width:180px}
.rec input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.rec .rt{font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:none;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.rec .rt:hover{border-color:var(--accent);color:var(--accent)}
.panel{display:block;max-width:760px;grid-template-columns:none}
.panel[hidden]{display:none}
.acts{display:grid;gap:12px;margin-top:20px}
.act{display:block;text-align:center;font:inherit;font-size:22px;font-weight:700;padding:18px;border-radius:14px;border:2px solid transparent;background:var(--card);color:var(--cardink);text-decoration:none;cursor:pointer}
.act:hover{border-color:var(--accent)}
.act.primary{background:var(--accent);color:#fff}
.act:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.card{aspect-ratio:1;font-family:inherit;font-size:clamp(30px,9vw,52px);border-radius:14px;border:2px solid transparent;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center}
.card.open{background:var(--card)}
.card.done{background:var(--card);opacity:.55}
.card:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.msgs{background:var(--card);color:var(--cardink);border-radius:14px;padding:12px;min-height:200px;max-height:50vh;overflow:auto;display:grid;gap:8px;align-content:start;font-size:18px;overflow-wrap:anywhere}
canvas{width:100%;height:auto;display:block;border-radius:14px;background:var(--card);touch-action:none}
.pad{display:flex;gap:12px;margin:12px 0}
.pad button{flex:1;font:inherit;font-size:26px;font-weight:700;min-height:68px;border-radius:14px;border:2px solid transparent;background:var(--card);color:var(--cardink);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active{background:var(--accent);color:#fff}
.pad button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
canvas{aspect-ratio:16/9;height:auto}
.gwrap{position:relative}
#quiz{position:absolute;inset:0;background:rgba(20,50,100,.35);display:grid;place-items:center;padding:12px;overflow:auto;border-radius:14px}
#quiz[hidden]{display:none}
.qbox{background:var(--card);color:var(--cardink);border-radius:14px;padding:16px;max-width:520px;width:100%;display:grid;gap:10px}
.qbox h2{margin:0;font-size:22px}
.qbox p{margin:0;font-size:18px}
.qopt{font-size:18px;padding:12px}
.qopt:disabled{opacity:.5;cursor:default}
.pad3{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:12px 0}
.dp{display:grid;gap:8px;justify-items:center}
.dprow{display:flex;gap:8px}
.pad3 button{font:inherit;font-size:24px;font-weight:700;width:68px;height:68px;border-radius:14px;border:2px solid transparent;background:var(--card);color:var(--cardink);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.pad3 button.jump{width:120px;height:120px;font-size:22px;background:var(--accent);color:#fff}
.pad3 button:active{filter:brightness(.8)}
.pad3 button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
#game{max-width:1200px}
.gwrap{max-width:calc(74vh*16/9);margin:0 auto}
.wds{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.wd{font:inherit;font-size:20px;padding:10px 16px;border-radius:999px;border:2px solid var(--accent);background:var(--card);color:var(--cardink);cursor:pointer}
.wd:disabled{opacity:.3;cursor:default}

/* app skin */
:root{--bg:#fff;--ink:#1e1e1e;--sub:#6b6b6b;--accent:#00a862;--card:#f4f6f5;--cardink:#1e1e1e;--focus:#00a862;--line:#e6e6e6}
body{background:#fff;color:var(--ink)}
main{display:block;max-width:520px;padding:12px 24px 96px;margin:0 auto}
.panel,#list{max-width:520px}
#game{max-width:1200px}
h1{font-size:clamp(26px,6vw,32px);font-weight:700;line-height:1.35;letter-spacing:-.02em;margin:24px 0 8px;text-align:left}
.sub,.lead{font-size:15px;font-weight:400;color:var(--sub);margin:0 0 16px;text-align:left}
.rule{display:none}
.back{border:0;border-radius:0;padding:10px 0;margin:0;font-size:17px;font-weight:500;color:var(--ink)}
.back:hover{color:var(--accent);border-color:transparent}
.logo{width:64px;max-width:none;margin:36px 0 12px;fill:#2f80ed;animation:none}
.act{border-radius:28px;min-height:52px;padding:14px 18px;font-size:17px;font-weight:500;background:#fff;border:1px solid #d8d8d8;color:var(--ink);box-shadow:none}
.act:hover{border-color:var(--accent)}
.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.act:disabled{background:#e4e4e4;border-color:#e4e4e4;color:#fff;cursor:default}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 24px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(255,255,255,0),#fff 30%)}
.cta .act{max-width:472px;margin:0 auto}
.types{list-style:none;margin:8px 0 0;padding:0}
.types li{border-bottom:1px solid var(--line)}
.types button{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:10px 2px;background:none;border:0;text-align:left;font:inherit;font-size:17px;font-weight:500;color:var(--ink);cursor:pointer}
.types button:before{content:"";flex:none;width:22px;height:22px;border:1.5px solid #c4c4c4;border-radius:50%;box-sizing:border-box}
.types button:after{content:"›";margin-left:auto;font-size:24px;color:#b5b5b5}
.types button[aria-pressed="true"]:before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px #fff}
.tt{display:grid}
.tt small{font-size:13px;font-weight:400;color:var(--sub);margin-top:2px}
#msg{font-size:14px;color:var(--sub);margin-top:12px;min-height:0}
.vids{gap:0}
.vids a,.vids button{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 2px;box-shadow:none}
.vids a:hover{border-color:var(--line);background:#f7faf8}
.thumb{background:var(--accent)}
.vt{font-weight:500}
.rec input[type=date],.rec input[type=text],#cname{background:transparent;border:0;border-bottom:1px solid #cfcfcf;border-radius:0;padding:8px 2px}
.rec .rt{border-width:1px;border-color:var(--accent);color:var(--accent);padding:5px 14px}
.qbox,.msgs{box-shadow:none;background:var(--card)}
#splash{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:50;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(40vw,200px);margin:0;fill:#2f80ed}

/* sizes + records */
.act{min-height:44px;padding:10px 16px;font-size:15px;border-radius:22px}
.acts{gap:8px;margin-top:14px;max-width:360px}
.cta{padding:10px 24px calc(12px + env(safe-area-inset-bottom,0px))}
.cta .act{width:100%;max-width:320px;min-height:44px}
.back{font-size:15px}
.pad3 button{width:52px;height:52px;font-size:18px;border-radius:12px}
.pad3 button.jump{width:84px;height:84px;font-size:16px}
.qopt{font-size:15px;padding:10px 14px}
.wd{font-size:16px;padding:8px 14px}
.linkbtn{font:inherit;font-size:15px;color:var(--accent);background:none;border:0;padding:6px 0;cursor:pointer;text-decoration:underline}
.rform{display:grid;gap:12px;margin:8px 0 20px}
.rform label{display:grid;gap:4px;font-size:13px;color:var(--sub)}
.rform input,.rform textarea{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid #cfcfcf;border-radius:0;padding:8px 2px;resize:vertical}
.rform input:focus,.rform textarea:focus{outline:none;border-bottom-color:var(--accent)}
.rform .act{justify-self:start;min-width:140px}
#rnote{margin:0;font-size:14px;color:var(--accent);min-height:1.2em}
.rh{font-size:17px;margin:8px 0}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{padding:12px 2px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.rt1{font-weight:500}
.rm1{font-size:14px;color:var(--sub);white-space:pre-wrap;overflow-wrap:anywhere}
.rempty{color:var(--sub);font-size:14px}
.rlist .linkbtn{justify-self:start;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"></div>
<main id="home">
  <svg class="dove logo" viewBox="0 0 400 340" role="img" aria-label="날아가는 비둘기">
    <path d="M150 215C120 150 110 100 95 55c25 10 45 25 60 40 5-15 10-35 20-65 25 40 65 80 115 120-60 10-100 40-140 65z"/>
    <path d="M120 230c30-40 110-60 170-55 20-25 50-35 70-20 12 8 12 21 2 25l18 6c-20 10-30 18-50 28-20 36-60 66-120 76l-100 10c-20 0-30-10-20-20 10-10 40-18 70-30z"/>
    <path d="M150 215L190 178L245 155L285 148L290 152L290 178L150 235z"/>
    <g stroke="#ff3030" stroke-width="5" stroke-linecap="round" fill="none"><path d="M222 112v154"/><path d="M186 172h72"/></g>
  </svg>
  <h1>안녕하세요.<br>모두를 위한 설교입니다.</h1>
  <p class="lead">듣고 싶은 설교 종류를 골라 주세요.</p>
  <ul class="types" id="types"></ul>
  <p id="msg" role="status" aria-live="polite"></p>
  <p class="lead"><button type="button" class="linkbtn" id="homeRec">📝 내 기록 보기</button></p>
  <div class="cta"><button type="button" class="act primary" id="homeNext" disabled>다음</button></div>
</main>
<main id="list" hidden>
  <button type="button" class="back" id="back">‹ 처음으로</button>
  <h1 id="ltitle" tabindex="-1"></h1>
  <p class="sub" id="lsub">보고 싶은 설교를 눌러 주세요.</p>
  <hr class="rule">
  <ul class="vids" id="vids"></ul>
  <p id="lmsg" role="status" aria-live="polite"></p>
  <p class="sub"><a id="ch" href="https://www.youtube.com/@chungwoonchurch" target="_blank" rel="noopener" style="color:var(--accent)">청운교회 유튜브 채널에서 더 보기</a></p>
</main>
<main class="panel" id="watch" hidden>
  <button type="button" class="back" data-go="list">‹ 목록</button>
  <h1 id="wtitle" tabindex="-1"></h1>
  <p class="sub" id="wmeta"></p>
  <hr class="rule">
  <p id="wnote">영상이 새 창에서 열렸어요. 열리지 않으면 '다시 보기'를 눌러 주세요.</p>
  <div class="acts">
    <a class="act" id="wlink" target="_blank" rel="noopener">▶ 다시 보기</a>
    <button type="button" class="act" id="toRec">📝 기록하기</button>
    <button type="button" class="act" data-go="home">처음으로</button>
    <button type="button" class="act primary" data-go="share">설교 나누기</button>
  </div>
</main>
<main class="panel" id="share" hidden>
  <button type="button" class="back" data-go="watch">‹ 돌아가기</button>
  <h1 tabindex="-1">설교 나누기</h1>
  <p class="sub" id="stitle"></p>
  <hr class="rule">
  <div class="acts">
    <button type="button" class="act" data-go="games">🎮 게임하기 (어린이)</button>
    <button type="button" class="act" id="toChat">💬 이 설교 단톡방</button>
  </div>
</main>
<main class="panel" id="game" hidden>
  <button type="button" class="back" data-go="games">‹ 게임 고르기</button>
  <h1 tabindex="-1">말씀 점프맵 3D</h1>
  <p class="sub" id="gmsg"></p>
  <div class="gwrap">
    <canvas id="cv" role="img" aria-label="3D 지오메트리 점프맵. 큐브를 움직여 끝에 있는 십자가까지 가요."></canvas>
    <div id="quiz" hidden></div>
  </div>
  <div class="pad3">
    <div class="dp"><button type="button" id="bf" aria-label="앞으로">▲</button><div class="dprow"><button type="button" id="bl" aria-label="왼쪽">◀</button><button type="button" id="bb" aria-label="뒤로">▼</button><button type="button" id="br" aria-label="오른쪽">▶</button></div></div>
    <button type="button" id="bj" class="jump" aria-label="점프">⤒<br>점프</button>
  </div>
  <button type="button" class="act" id="gnew">처음부터 다시</button>
</main>
<main class="panel" id="chat" hidden>
  <button type="button" class="back" data-go="share">‹ 돌아가기</button>
  <h1 tabindex="-1">단톡방</h1>
  <p class="sub" id="ctitle"></p>
  <div class="msgs" id="cmsgs" role="log" aria-live="polite"></div>
  <div class="rec">
    <input type="text" id="cname" maxlength="20" placeholder="내 이름" aria-label="내 이름" style="width:110px">
    <input type="text" id="ctext" maxlength="300" placeholder="메시지를 적어 주세요" aria-label="메시지">
    <button type="button" class="rt" id="csend">보내기</button>
  </div>
  <p id="cnote" role="status"></p>
</main>
<main class="panel" id="games" hidden>
  <button type="button" class="back" data-go="share">‹ 돌아가기</button>
  <h1 tabindex="-1">게임 고르기</h1>
  <p class="sub">하고 싶은 게임을 눌러 주세요.</p>
  <hr class="rule">
  <div class="acts">
    <button type="button" class="act" data-go="game">🧊 3D 점프맵 + 말씀 퀴즈</button>
    <button type="button" class="act" id="gOX">⭕❌ OX 퀴즈</button>
    <button type="button" class="act" id="gCard">🃏 카드 짝 맞추기</button>
    <button type="button" class="act" id="gWord">🧩 말씀 문장 퍼즐</button>
  </div>
</main>
<main class="panel" id="mini" hidden>
  <button type="button" class="back" data-go="games">‹ 게임 고르기</button>
  <h1 id="mtitle" tabindex="-1"></h1>
  <p class="sub" id="mmsg"></p>
  <div id="marea"></div>
  <button type="button" class="act" id="mre">다시 하기</button>
</main>
<main class="panel" id="rec" hidden>
  <button type="button" class="back" id="recBack">‹ 돌아가기</button>
  <h1 tabindex="-1">내 기록</h1>
  <p class="sub">본 설교를 날짜와 함께 기록해요.</p>
  <div class="rform">
    <label>설교 제목<input type="text" id="rtitle" maxlength="60" placeholder="예: 염려하지 말라"></label>
    <label>본 날짜<input type="date" id="rdate"></label>
    <label>느낀 점 (선택)<textarea id="rmemo" maxlength="300" rows="3" placeholder="은혜받은 말씀, 느낀 점"></textarea></label>
    <button type="button" class="act primary" id="rsave">기록하기</button>
    <p id="rnote" role="status"></p>
  </div>
  <h2 class="rh">기록 목록</h2>
  <ul class="rlist" id="rlist"></ul>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var TYPES=[["주일 설교","일요일 예배"],["새벽 설교","이른 아침 말씀"],["수요 설교","수요 예배"],["금요 온가족 기도회","금요일 밤 기도회"]];
var list=document.getElementById("types"),msg=document.getElementById("msg"),selT=null,cta=document.getElementById("homeNext");
TYPES.forEach(function(t){
  var li=document.createElement("li"),b=document.createElement("button");
  b.type="button";b.setAttribute("aria-pressed","false");
  b.innerHTML='<span class="tt">'+t[0]+'<small>'+t[1]+'</small></span>';
  b.onclick=function(){selT=t;list.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed","false");});b.setAttribute("aria-pressed","true");cta.disabled=false;};
  li.appendChild(b);list.appendChild(li);
});

var home=document.getElementById("home"),lst=document.getElementById("list"),vids=document.getElementById("vids"),lmsg=document.getElementById("lmsg"),ltitle=document.getElementById("ltitle");
var YT="https://www.youtube.com/watch?v=";
var V={

function showList(t){
  ltitle.textContent=t[0];lmsg.textContent="";vids.innerHTML="";
  var items=V[t[0]]||[];
  items.forEach(function(v){
    var li=document.createElement("li"),a=document.createElement("a");
    a.href=v[5]||YT+v[4];a.onclick=function(e){e.preventDefault();openVideo(v);};
    a.innerHTML='<span class="thumb" aria-hidden="true"></span><span><span class="vt"></span><span class="vm"></span></span>';
    a.querySelector(".vt").textContent=v[0];
    a.querySelector(".vm").textContent=v[3]+" · "+v[1]+" · "+v[2];
    li.appendChild(a);vids.appendChild(li);
  });
  if(!items.length)lmsg.textContent="아직 이 종류의 영상을 담지 못했어요. 아래 채널에서 찾아보실 수 있어요.";
  go("list");
}

function go(id){
  if(id!=="chat"&&unsub){unsub();unsub=null;}
  SCR.forEach(function(x){document.getElementById(x).hidden=(x!==id);});
  window.scrollTo(0,0);
  var h=document.querySelector("#"+id+" h1");if(h){h.tabIndex=-1;h.focus();}
}
document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-go"));};});
function openVideo(v){
  CUR=v;
  var url=v[5]||YT+v[4];
  document.getElementById("wtitle").textContent=v[0];
  document.getElementById("wmeta").textContent=v[3]+" · "+v[1]+" · "+v[2];
  document.getElementById("wlink").href=url;
  document.getElementById("stitle").textContent=v[0];
  window.open(url,"_blank","noopener");
  go("watch");
}

  DBp.collection("chat/"+CUR[4]+"/msgs").add({n:n,m:m,t:Date.now()}).then(function(){ctext.value="";cnote.textContent="";}).catch(function(){locSave(n,m);startLocal("함께 쓰는 단톡방에 글을 쓸 수 없어요. 지금은 ");});
}
csend.onclick=sendMsg;
ctext.onkeydown=function(e){if(e.key==="Enter")sendMsg();};

var mArea=document.getElementById("marea"),mMsg=document.getElementById("mmsg"),mTitle=document.getElementById("mtitle"),curMini=null;
function getSet(){return SETS[CUR&&CUR[4]]||GEN;}
function miniOX(){
  var qs=buildQs(getSet()).slice(0,6),i=0,sc=0;
  function next(){
    mArea.innerHTML="";
    if(i>=qs.length){mMsg.textContent="🎉 끝! "+sc+"/"+qs.length+"개 맞혔어요.";return;}
    var q=qs[i],truth=Math.random()<.5,ans=truth?q.o[0]:q.o[1+Math.floor(Math.random()*(q.o.length-1))];
    mMsg.textContent=(i+1)+"/"+qs.length+" · 맞으면 ⭕, 틀리면 ❌";
    var box=document.createElement("div");box.className="qbox";
    var p=document.createElement("p");p.textContent=q.q+" → "+ans;
    var fb=document.createElement("p");fb.setAttribute("role","status");
    var row=document.createElement("div");row.className="acts";
    [["⭕",true],["❌",false]].forEach(function(x){
      var b=document.createElement("button");b.type="button";b.className="act";b.textContent=x[0];
      b.onclick=function(){
        row.querySelectorAll("button").forEach(function(y){y.disabled=true;});
        var ok=(x[1]===truth);if(ok)sc++;
        fb.textContent=(ok?"⭕ 맞아요! ":"❌ 아니에요. ")+"정답은 '"+q.o[0]+"'. "+q.e;
        var n=document.createElement("button");n.type="button";n.className="act primary";n.textContent=(i+1>=qs.length)?"결과 보기":"다음";
        n.onclick=function(){i++;next();};box.appendChild(n);n.focus();
      };
      row.appendChild(b);
    });
    box.appendChild(p);box.appendChild(row);box.appendChild(fb);mArea.appendChild(box);
  }
  next();
}
function miniCard(){
  var EM=["🕊️","✝️","📖","🐑","⭐","🍞"],a=shuf(EM.concat(EM)),first=null,lock=false,moves=0,found=0;
  mMsg.textContent="같은 그림 두 장을 찾아보세요.";mArea.className="board";
  function cover(b){b.className="card";b.textContent="";b.setAttribute("aria-label","뒤집지 않은 카드");}
  a.forEach(function(e){
    var b=document.createElement("button");b.type="button";b.dataset.e=e;cover(b);
    b.onclick=function(){
      if(lock||b.classList.contains("open")||b.classList.contains("done"))return;
      b.className="card open";b.textContent=e;b.setAttribute("aria-label","카드 "+e);
      if(!first){first=b;return;}
      moves++;
      if(first.dataset.e===e){
        first.className="card done";b.className="card done";first=null;found++;
        if(found===EM.length)mMsg.textContent="🎉 모두 찾았어요! "+moves+"번 만에 성공! 오늘의 말씀: "+getSet().line;
      }else{lock=true;var f=first;first=null;setTimeout(function(){cover(f);cover(b);lock=false;},800);}
    };
    mArea.appendChild(b);
  });
}
function miniWord(){
  var st=getSet(),w=st.line.split(" "),idx=0;
  mMsg.textContent="단어를 순서대로 눌러 말씀 한 줄을 완성해요. ("+st.ref+")";
  var out=document.createElement("p");out.style.fontSize="22px";out.style.fontWeight="700";out.textContent="…";
  var pool=document.createElement("div");pool.className="wds";
  shuf(w.map(function(t){return {t:t};})).forEach(function(o){
    var b=document.createElement("button");b.type="button";b.className="wd";b.textContent=o.t;
    b.onclick=function(){
      if(w[idx]===o.t){
        idx++;b.disabled=true;out.textContent=w.slice(0,idx).join(" ");
        if(idx===w.length)mMsg.textContent="🎉 완성! "+st.ref;
      }else{mMsg.textContent="앗, 다른 단어를 먼저 찾아봐요.";}
    };
    pool.appendChild(b);
  });
  mArea.appendChild(out);mArea.appendChild(pool);
}
var MINI={ox:["⭕❌ OX 퀴즈",miniOX],card:["🃏 카드 짝 맞추기",miniCard],word:["🧩 말씀 문장 퍼즐",miniWord]};
function startMini(k){curMini=k;go("mini");mTitle.textContent=MINI[k][0];mArea.className="";mArea.innerHTML="";MINI[k][1]();}
document.getElementById("gOX").onclick=function(){startMini("ox");};
document.getElementById("gCard").onclick=function(){startMini("card");};
document.getElementById("gWord").onclick=function(){startMini("word");};
document.getElementById("mre").onclick=function(){startMini(curMini);};

cta.onclick=function(){if(selT)showList(selT);};
(function(){
  var sp=document.getElementById("splash"),lg=document.querySelector("#home .logo");
  if(lg)sp.innerHTML=lg.outerHTML;
  setTimeout(function(){sp.classList.add("out");setTimeout(function(){sp.style.display="none";},600);},1300);
})();

var recFrom="home",rtitle=document.getElementById("rtitle"),rdate=document.getElementById("rdate"),rmemo=document.getElementById("rmemo"),rnote=document.getElementById("rnote");
function loadRec(){try{return JSON.parse(localStorage.getItem("sermonRecords")||"[]");}catch(e){return [];}}
function saveRec(a){try{localStorage.setItem("sermonRecords",JSON.stringify(a));return true;}catch(e){return false;}}
function renderRec(){
  var a=loadRec().sort(function(x,y){return x.d<y.d?1:x.d>y.d?-1:y.id-x.id;}),ul=document.getElementById("rlist");
  ul.innerHTML="";
  if(!a.length){var e=document.createElement("li");e.className="rempty";e.textContent="아직 기록이 없어요.";ul.appendChild(e);return;}
  a.forEach(function(r){
    var li=document.createElement("li"),t=document.createElement("div"),m=document.createElement("div"),d=document.createElement("button");
    t.className="rt1";t.textContent=r.d+" · "+r.t;
    m.className="rm1";m.textContent=r.m||"";
    d.type="button";d.className="linkbtn";d.textContent="삭제";
    d.onclick=function(){
      if(!d.dataset.sure){d.dataset.sure="1";d.textContent="한 번 더 누르면 삭제돼요";return;}
      saveRec(loadRec().filter(function(x){return x.id!==r.id;}));renderRec();
    };
    li.appendChild(t);if(r.m)li.appendChild(m);li.appendChild(d);ul.appendChild(li);
  });
}
function openRec(from){
  recFrom=from;go("rec");
  rtitle.value=(from==="watch"&&CUR)?CUR[0]:"";rdate.value=todayStr();rmemo.value="";rnote.textContent="";
  renderRec();
}
document.getElementById("toRec").onclick=function(){openRec("watch");};
document.getElementById("homeRec").onclick=function(){openRec("home");};
document.getElementById("recBack").onclick=function(){go(recFrom);};
document.getElementById("rsave").onclick=function(){
  var t=rtitle.value.trim();
  if(!t){rnote.textContent="설교 제목을 적어 주세요.";return;}
  var a=loadRec();a.push({id:Date.now(),d:rdate.value||todayStr(),t:t,m:rmemo.value.trim()});
  if(!saveRec(a)){rnote.textContent="저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.";return;}
  rmemo.value="";rnote.textContent="기록했어요 ✓";renderRec();
};
</script>
